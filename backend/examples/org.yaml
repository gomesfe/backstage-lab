---
# Estrutura organizacional do lab.
#
# O login do GitHub é resolvido por `usernameMatchingUserEntityName`: o seu
# username vira `user:default/<username>`. Se não existir um User aqui com esse
# nome, o catálogo não conhece seus grupos, o RBAC não encontra vínculo e cai
# no default fechado. Ou seja: para entrar, você precisa estar listado abaixo.
#
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: gomesfe
  description: Engenharia de plataforma
spec:
  profile:
    displayName: Felipe Gomes
  memberOf: [plataforma]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf: [guests]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: plataforma
  description: Time dono do portal e da infraestrutura
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: desenvolvimento
  description: Times de produto que consomem o portal
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
spec:
  type: team
  children: []
# Squads de exemplo do Atlas (donos das entidades de atlas-catalog.yaml) e o
# time do Atlas, dono dos itens internos.
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: pagamentos
  description: "Squad de pagamentos."
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: antifraude
  description: "Squad de antifraude."
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: onboarding
  description: "Squad de onboarding."
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: atlas
  description: "Time do Atlas: o portal, o agente e as ofertas internas."
spec:
  type: team
  children: []
