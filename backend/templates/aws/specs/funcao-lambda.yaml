slug: funcao-lambda
title: Função Lambda
description: Função serverless, cobrada por invocação e tempo de execução.
category: Computação
module:
  source: terraform-aws-modules/lambda/aws
  version: 7.7.1
parameters:
  - id: runtime
    title: Runtime
    type: string
    default: nodejs22.x
    enum: [nodejs22.x, python3.12, java21, dotnet8]
  - id: handler
    title: Handler
    type: string
    default: index.handler
  - id: memorySize
    title: Memória (MB)
    type: number
    default: 512
    help: CPU é proporcional à memória. Mais memória pode sair mais barato.
  - id: timeout
    title: Timeout (s)
    type: number
    default: 30
inputs:
  function_name: local.name
  runtime: '"${{ values.runtime }}"'
  handler: '"${{ values.handler }}"'
  memory_size: '${{ values.memorySize }}'
  timeout: '${{ values.timeout }}'
  create_package: 'false'
  local_existing_package: '"./dist/function.zip"'
