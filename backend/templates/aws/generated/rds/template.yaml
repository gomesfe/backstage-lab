# Fonte: templates/aws/specs/rds.yaml
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: atlas-template-rds
  title: Banco relacional RDS
  description: Instância RDS gerenciada, para Postgres ou MySQL.
  tags:
    - aws
    - terraform
    - rds
  annotations:
    atlas.nuclea.com.br/categoria: Banco de dados
spec:
  owner: group:default/plataforma
  type: resource
  parameters:
    - title: O recurso
      required:
        - nome
        - squad
        - ambiente
      properties:
        nome:
          title: Nome do recurso
          type: string
          description: kebab-case. Entra no nome final junto com squad e ambiente.
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          ui:autofocus: true
        squad:
          title: Squad dona
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        ambiente:
          title: Ambiente
          type: string
          default: dev
          enum:
            - dev
            - hml
            - prd
    - title: Banco relacional RDS
      properties:
        engine:
          title: Engine
          type: string
          enum:
            - postgres
            - mysql
          default: postgres
        engineVersion:
          title: Versão da engine
          type: string
          default: "16.3"
        instanceClass:
          title: Classe da instância
          type: string
          enum:
            - db.t4g.medium
            - db.t4g.large
            - db.m6g.large
            - db.m6g.xlarge
          default: db.t4g.medium
        allocatedStorage:
          title: Armazenamento (GB)
          type: number
          default: 50
        multiAz:
          title: Multi-AZ
          type: boolean
          description: Ligue em produção. Dobra o custo e remove o ponto único de falha.
          default: false
    - title: Onde publicar
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repositório de infraestrutura
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: mode
      name: Ler o modo de provisionamento
      action: atlas:mode
    - id: fetch
      name: Gerar o Terraform
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ${{ parameters.squad | replace("group:default/", "") }}/${{ parameters.nome }}/${{ parameters.ambiente }}
        values:
          nome: ${{ parameters.nome }}
          squad: ${{ parameters.squad }}
          ambiente: ${{ parameters.ambiente }}
          repoUrl: ${{ parameters.repoUrl }}
          engine: ${{ parameters.engine }}
          engineVersion: ${{ parameters.engineVersion }}
          instanceClass: ${{ parameters.instanceClass }}
          allocatedStorage: ${{ parameters.allocatedStorage }}
          multiAz: ${{ parameters.multiAz }}
    - id: local
      name: Escrever os arquivos localmente
      if: ${{ steps.mode.output.isLocal }}
      action: atlas:publish:local
      input:
        name: ${{ parameters.nome }}-${{ parameters.ambiente }}
    - id: pr
      name: Abrir PR na infraestrutura
      if: ${{ steps.mode.output.isGithub }}
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: atlas/${{ parameters.nome }}-${{ parameters.ambiente }}
        title: "feat(rds): ${{ parameters.nome }} em ${{ parameters.ambiente }}"
        description: |-
          Banco relacional RDS pedido pelo portal.

          - módulo: `terraform-aws-modules/rds/aws` v6.10.0
          - squad: `${{ parameters.squad }}`
          - ambiente: `${{ parameters.ambiente }}`

          O portal **não aplica** nada. Depois do merge, o pipeline deste
          repositório roda o `terraform apply`.
  output:
    links:
      - title: Ver o Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
      - title: Arquivos gerados
        url: ${{ steps.local.output.remoteUrl }}
    text:
      - title: Modo
        content: ${{ steps.mode.output.mode }}
