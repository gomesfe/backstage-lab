apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.squad | replace("group:default/", "") }}-${{ values.nome }}-${{ values.ambiente }}
  description: Aurora Serverless v2 provisionado pelo Atlas
  annotations:
    atlas.nuclea.com.br/recurso: aurora
    atlas.nuclea.com.br/ambiente: ${{ values.ambiente }}
  tags:
    - aws
    - aurora
    - ${{ values.ambiente }}
spec:
  type: aurora
  owner: ${{ values.squad }}
  system: infraestrutura
