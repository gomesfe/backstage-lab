# Fonte: templates/aws/specs/funcao-lambda.yaml
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: atlas-template-funcao-lambda
  title: Função Lambda
  description: Função serverless, cobrada por invocação e tempo de execução.
  tags:
    - aws
    - terraform
    - funcao-lambda
  annotations:
    atlas.nuclea.com.br/categoria: Computação
spec:
  owner: group:default/plataforma
  type: resource
  parameters:
    - title: O recurso
      required:
        - nome
        - squad
        - ambiente
      properties:
        nome:
          title: Nome do recurso
          type: string
          description: kebab-case. Entra no nome final junto com squad e ambiente.
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          ui:autofocus: true
        squad:
          title: Squad dona
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        ambiente:
          title: Ambiente
          type: string
          default: dev
          enum:
            - dev
            - hml
            - prd
    - title: Função Lambda
      properties:
        runtime:
          title: Runtime
          type: string
          enum:
            - nodejs22.x
            - python3.12
            - java21
            - dotnet8
          default: nodejs22.x
        handler:
          title: Handler
          type: string
          default: index.handler
        memorySize:
          title: Memória (MB)
          type: number
          description: CPU é proporcional à memória. Mais memória pode sair mais barato.
          default: 512
        timeout:
          title: Timeout (s)
          type: number
          default: 30
    - title: Onde publicar
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repositório de infraestrutura
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: mode
      name: Ler o modo de provisionamento
      action: atlas:mode
    - id: fetch
      name: Gerar o Terraform
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ${{ parameters.squad | replace("group:default/", "") }}/${{ parameters.nome }}/${{ parameters.ambiente }}
        values:
          nome: ${{ parameters.nome }}
          squad: ${{ parameters.squad }}
          ambiente: ${{ parameters.ambiente }}
          repoUrl: ${{ parameters.repoUrl }}
          runtime: ${{ parameters.runtime }}
          handler: ${{ parameters.handler }}
          memorySize: ${{ parameters.memorySize }}
          timeout: ${{ parameters.timeout }}
    - id: local
      name: Escrever os arquivos localmente
      if: ${{ steps.mode.output.isLocal }}
      action: atlas:publish:local
      input:
        name: ${{ parameters.nome }}-${{ parameters.ambiente }}
    - id: pr
      name: Abrir PR na infraestrutura
      if: ${{ steps.mode.output.isGithub }}
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: atlas/${{ parameters.nome }}-${{ parameters.ambiente }}
        title: "feat(funcao-lambda): ${{ parameters.nome }} em ${{ parameters.ambiente }}"
        description: |-
          Função Lambda pedido pelo portal.

          - módulo: `terraform-aws-modules/lambda/aws` v7.7.1
          - squad: `${{ parameters.squad }}`
          - ambiente: `${{ parameters.ambiente }}`

          O portal **não aplica** nada. Depois do merge, o pipeline deste
          repositório roda o `terraform apply`.
  output:
    links:
      - title: Ver o Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
      - title: Arquivos gerados
        url: ${{ steps.local.output.remoteUrl }}
    text:
      - title: Modo
        content: ${{ steps.mode.output.mode }}
