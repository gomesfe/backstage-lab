apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.squad | replace("group:default/", "") }}-${{ values.nome }}-${{ values.ambiente }}
  description: Elastic File System provisionado pelo Atlas
  annotations:
    atlas.nuclea.com.br/recurso: efs
    atlas.nuclea.com.br/ambiente: ${{ values.ambiente }}
  tags:
    - aws
    - efs
    - ${{ values.ambiente }}
spec:
  type: efs
  owner: ${{ values.squad }}
  system: infraestrutura
