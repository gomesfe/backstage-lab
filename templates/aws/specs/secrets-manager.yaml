slug: secrets-manager
title: Secret no Secrets Manager
description: Segredo versionado e rotacionável, sem valor no Terraform.
category: Desenvolvimento
module:
  source: terraform-aws-modules/secrets-manager/aws
  version: 1.3.1
parameters:
  - id: recoveryWindowDays
    title: Janela de recuperação (dias)
    type: number
    default: 7
    help: Tempo para desfazer uma exclusão. Zero apaga na hora.
inputs:
  name: local.name
  description: '"Secret de ${{ values.nome }} (${{ values.ambiente }})"'
  recovery_window_in_days: '${{ values.recoveryWindowDays }}'
  create_random_password: 'false'
  ignore_secret_changes: 'true'
