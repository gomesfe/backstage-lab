# Fonte: templates/aws/specs/ec2.yaml
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: atlas-template-ec2
  title: Instância EC2
  description: Máquina virtual. Prefira ECS ou Lambda se não precisar do host.
  tags:
    - aws
    - terraform
    - ec2
  annotations:
    atlas.nuclea.com.br/categoria: Computação
spec:
  owner: group:default/plataforma
  type: resource
  parameters:
    - title: O recurso
      required:
        - nome
        - squad
        - ambiente
      properties:
        nome:
          title: Nome do recurso
          type: string
          description: kebab-case. Entra no nome final junto com squad e ambiente.
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          ui:autofocus: true
        squad:
          title: Squad dona
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        ambiente:
          title: Ambiente
          type: string
          default: dev
          enum:
            - dev
            - hml
            - prd
    - title: Instância EC2
      properties:
        instanceType:
          title: Tipo da instância
          type: string
          enum:
            - t3.micro
            - t3.small
            - t3.medium
            - m6i.large
          default: t3.small
        volumeSize:
          title: Disco raiz (GB)
          type: number
          default: 30
    - title: Onde publicar
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repositório de infraestrutura
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: mode
      name: Ler o modo de provisionamento
      action: atlas:mode
    - id: fetch
      name: Gerar o Terraform
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ${{ parameters.squad | replace("group:default/", "") }}/${{ parameters.nome }}/${{ parameters.ambiente }}
        values:
          nome: ${{ parameters.nome }}
          squad: ${{ parameters.squad }}
          ambiente: ${{ parameters.ambiente }}
          repoUrl: ${{ parameters.repoUrl }}
          instanceType: ${{ parameters.instanceType }}
          volumeSize: ${{ parameters.volumeSize }}
    - id: local
      name: Escrever os arquivos localmente
      if: ${{ steps.mode.output.isLocal }}
      action: atlas:publish:local
      input:
        name: ${{ parameters.nome }}-${{ parameters.ambiente }}
    - id: pr
      name: Abrir PR na infraestrutura
      if: ${{ steps.mode.output.isGithub }}
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: atlas/${{ parameters.nome }}-${{ parameters.ambiente }}
        title: "feat(ec2): ${{ parameters.nome }} em ${{ parameters.ambiente }}"
        description: |-
          Instância EC2 pedido pelo portal.

          - módulo: `terraform-aws-modules/ec2-instance/aws` v5.7.1
          - squad: `${{ parameters.squad }}`
          - ambiente: `${{ parameters.ambiente }}`

          O portal **não aplica** nada. Depois do merge, o pipeline deste
          repositório roda o `terraform apply`.
  output:
    links:
      - title: Ver o Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
      - title: Arquivos gerados
        url: ${{ steps.local.output.remoteUrl }}
    text:
      - title: Modo
        content: ${{ steps.mode.output.mode }}
