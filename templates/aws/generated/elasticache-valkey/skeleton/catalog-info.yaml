apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.squad | replace("group:default/", "") }}-${{ values.nome }}-${{ values.ambiente }}
  description: Cache Valkey provisionado pelo Atlas
  annotations:
    atlas.nuclea.com.br/recurso: elasticache-valkey
    atlas.nuclea.com.br/ambiente: ${{ values.ambiente }}
  tags:
    - aws
    - elasticache-valkey
    - ${{ values.ambiente }}
spec:
  type: elasticache-valkey
  owner: ${{ values.squad }}
  system: infraestrutura
