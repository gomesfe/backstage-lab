# Fonte: templates/aws/specs/dynamodb.yaml
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: atlas-template-dynamodb
  title: Tabela DynamoDB
  description: Tabela NoSQL serverless, cobrada por requisição ou capacidade.
  tags:
    - aws
    - terraform
    - dynamodb
  annotations:
    atlas.nuclea.com.br/categoria: Banco de dados
spec:
  owner: group:default/plataforma
  type: resource
  parameters:
    - title: O recurso
      required:
        - nome
        - squad
        - ambiente
      properties:
        nome:
          title: Nome do recurso
          type: string
          description: kebab-case. Entra no nome final junto com squad e ambiente.
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          ui:autofocus: true
        squad:
          title: Squad dona
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        ambiente:
          title: Ambiente
          type: string
          default: dev
          enum:
            - dev
            - hml
            - prd
    - title: Tabela DynamoDB
      properties:
        hashKey:
          title: Chave de partição
          type: string
          description: "Atributo que distribui os dados. ex: pedidoId"
        rangeKey:
          title: Chave de ordenação
          type: string
          description: Opcional. Deixe vazio se a chave de partição já é única.
          default: ""
        billingMode:
          title: Cobrança
          type: string
          enum:
            - PAY_PER_REQUEST
            - PROVISIONED
          default: PAY_PER_REQUEST
        pointInTimeRecovery:
          title: Point-in-time recovery
          type: boolean
          default: true
      required:
        - hashKey
    - title: Onde publicar
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repositório de infraestrutura
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: fetch
      name: Gerar o Terraform
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ${{ values.squad | replace("group:default/", "") }}/${{ values.nome }}/${{ values.ambiente }}
        values:
          nome: ${{ parameters.nome }}
          squad: ${{ parameters.squad }}
          ambiente: ${{ parameters.ambiente }}
          repoUrl: ${{ parameters.repoUrl }}
          hashKey: ${{ parameters.hashKey }}
          rangeKey: ${{ parameters.rangeKey }}
          billingMode: ${{ parameters.billingMode }}
          pointInTimeRecovery: ${{ parameters.pointInTimeRecovery }}
    - id: pr
      name: Abrir PR na infraestrutura
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: atlas/${{ parameters.nome }}-${{ parameters.ambiente }}
        title: "feat(dynamodb): ${{ parameters.nome }} em ${{ parameters.ambiente }}"
        description: |-
          Tabela DynamoDB pedido pelo portal.

          - módulo: `terraform-aws-modules/dynamodb-table/aws` v4.2.0
          - squad: `${{ parameters.squad }}`
          - ambiente: `${{ parameters.ambiente }}`

          O portal **não aplica** nada. Depois do merge, o pipeline deste
          repositório roda o `terraform apply`.
  output:
    links:
      - title: Ver o Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
