apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.squad | replace("group:default/", "") }}-${{ values.nome }}-${{ values.ambiente }}
  description: Secret no Secrets Manager provisionado pelo Atlas
  annotations:
    atlas.nuclea.com.br/recurso: secrets-manager
    atlas.nuclea.com.br/ambiente: ${{ values.ambiente }}
  tags:
    - aws
    - secrets-manager
    - ${{ values.ambiente }}
spec:
  type: secrets-manager
  owner: ${{ values.squad }}
  system: infraestrutura
