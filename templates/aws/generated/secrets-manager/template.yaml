# Fonte: templates/aws/specs/secrets-manager.yaml
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: atlas-template-secrets-manager
  title: Secret no Secrets Manager
  description: Segredo versionado e rotacionável, sem valor no Terraform.
  tags:
    - aws
    - terraform
    - secrets-manager
  annotations:
    atlas.nuclea.com.br/categoria: Desenvolvimento
spec:
  owner: group:default/plataforma
  type: resource
  parameters:
    - title: O recurso
      required:
        - nome
        - squad
        - ambiente
      properties:
        nome:
          title: Nome do recurso
          type: string
          description: kebab-case. Entra no nome final junto com squad e ambiente.
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          ui:autofocus: true
        squad:
          title: Squad dona
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        ambiente:
          title: Ambiente
          type: string
          default: dev
          enum:
            - dev
            - hml
            - prd
    - title: Secret no Secrets Manager
      properties:
        recoveryWindowDays:
          title: Janela de recuperação (dias)
          type: number
          description: Tempo para desfazer uma exclusão. Zero apaga na hora.
          default: 7
    - title: Onde publicar
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repositório de infraestrutura
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: mode
      name: Ler o modo de provisionamento
      action: atlas:mode
    - id: fetch
      name: Gerar o Terraform
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ${{ parameters.squad | replace("group:default/", "") }}/${{ parameters.nome }}/${{ parameters.ambiente }}
        values:
          nome: ${{ parameters.nome }}
          squad: ${{ parameters.squad }}
          ambiente: ${{ parameters.ambiente }}
          repoUrl: ${{ parameters.repoUrl }}
          recoveryWindowDays: ${{ parameters.recoveryWindowDays }}
    - id: local
      name: Escrever os arquivos localmente
      if: ${{ steps.mode.output.isLocal }}
      action: atlas:publish:local
      input:
        name: ${{ parameters.nome }}-${{ parameters.ambiente }}
    - id: pr
      name: Abrir PR na infraestrutura
      if: ${{ steps.mode.output.isGithub }}
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: atlas/${{ parameters.nome }}-${{ parameters.ambiente }}
        title: "feat(secrets-manager): ${{ parameters.nome }} em ${{ parameters.ambiente }}"
        description: |-
          Secret no Secrets Manager pedido pelo portal.

          - módulo: `terraform-aws-modules/secrets-manager/aws` v1.3.1
          - squad: `${{ parameters.squad }}`
          - ambiente: `${{ parameters.ambiente }}`

          O portal **não aplica** nada. Depois do merge, o pipeline deste
          repositório roda o `terraform apply`.
  output:
    links:
      - title: Ver o Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
      - title: Arquivos gerados
        url: ${{ steps.local.output.remoteUrl }}
    text:
      - title: Modo
        content: ${{ steps.mode.output.mode }}
