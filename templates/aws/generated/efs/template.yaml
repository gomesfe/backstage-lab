# GERADO POR scripts/generate-aws-templates.mjs — NÃO EDITE À MÃO.
# Fonte: templates/aws/specs/efs.yaml
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: atlas-template-efs
  title: Elastic File System
  description: Sistema de arquivos compartilhado entre instâncias e containers.
  tags:
    - aws
    - terraform
    - efs
  annotations:
    atlas.nuclea.com.br/categoria: Armazenamento
spec:
  owner: group:default/plataforma
  type: resource
  parameters:
    - title: O recurso
      required:
        - nome
        - squad
        - ambiente
      properties:
        nome:
          title: Nome do recurso
          type: string
          description: kebab-case. Entra no nome final junto com squad e ambiente.
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          ui:autofocus: true
        squad:
          title: Squad dona
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        ambiente:
          title: Ambiente
          type: string
          default: dev
          enum:
            - dev
            - hml
            - prd
    - title: Elastic File System
      properties:
        performanceMode:
          title: Modo de performance
          type: string
          enum:
            - generalPurpose
            - maxIO
          default: generalPurpose
        transitionToIa:
          title: Mover para acesso infrequente após
          type: string
          enum:
            - AFTER_7_DAYS
            - AFTER_30_DAYS
            - AFTER_90_DAYS
          default: AFTER_30_DAYS
    - title: Onde publicar
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repositório de infraestrutura
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
  steps:
    - id: fetch
      name: Gerar o Terraform
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ${{ values.squad | replace("group:default/", "") }}/${{ values.nome }}/${{ values.ambiente }}
        values:
          nome: ${{ parameters.nome }}
          squad: ${{ parameters.squad }}
          ambiente: ${{ parameters.ambiente }}
          repoUrl: ${{ parameters.repoUrl }}
          performanceMode: ${{ parameters.performanceMode }}
          transitionToIa: ${{ parameters.transitionToIa }}
    - id: pr
      name: Abrir PR na infraestrutura
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: atlas/${{ parameters.nome }}-${{ parameters.ambiente }}
        title: "feat(efs): ${{ parameters.nome }} em ${{ parameters.ambiente }}"
        description: |-
          Elastic File System pedido pelo portal.

          - módulo: `terraform-aws-modules/efs/aws` v1.6.5
          - squad: `${{ parameters.squad }}`
          - ambiente: `${{ parameters.ambiente }}`

          O portal **não aplica** nada. Depois do merge, o pipeline deste
          repositório roda o `terraform apply`.
  output:
    links:
      - title: Ver o Pull Request
        url: ${{ steps.pr.output.remoteUrl }}
